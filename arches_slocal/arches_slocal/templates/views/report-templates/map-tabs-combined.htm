{% extends "views/report-templates/default.htm" %}
{% load i18n %}

{% block header %}
<div style="background: red; color: white; padding: 10px; font-size: 16px; font-weight: bold; text-align: center;">*** CUSTOM TEMPLATE IS ACTIVE ***</div>

<!-- Map Section -->
<!-- CUSTOM MAP+TABS TEMPLATE ACTIVE -->
<!-- ko if: true -->
<div data-bind="component: {
    name: 'report-header-map',
    params: $data
}" class="report-map-header-component" style="margin-bottom: 20px;"></div>
<!-- /ko -->

<!-- Tabbed Report Section -->
<!-- ko if: tabs()[activeTabIndex()]  -->
<div>
    <div class="tabbed-report-tab-list" role="tablist">
        <!-- ko foreach: {data: tabs, as: 'tab'}  -->
        <div data-bind="let: {tabuid: Math.random().toString(16).slice(2)}">
            <div tabindex="0" data-bind="onEnterkeyClick, onSpaceClick, click: function(){ $parent.setActiveTab($index()); document.querySelector('.rp-tabpanel-id').setAttribute('id', tabuid); }, css: { 'active': ko.unwrap($parent.activeTabIndex) === $index() }, attr: { 'aria-expanded': ko.unwrap($parent.activeTabIndex) === $index() ? 'true' : 'false', 'aria-controls': tabuid }" class="report-tab report-tab-square" role="tab">
                <span data-bind="text: tab.name"></span>
            </div>
        </div>
        <!-- /ko -->
    </div>
</div>
<div class="tab-banner">
    <div style="display: flex; flex-direction: row">
        <span><i data-bind="class: report.get('iconclass') || 'fa fa-file-o'"></i></span>
        <!--ko if: report.get('displayname')-->
        <span style="padding: 0 5px;" data-bind="text: report.get('displayname') || '(' + $root.translations.resourceInstanceName + ')'"></span>
        <!--/ko-->
        <!--ko ifnot: report.get('displayname')-->
        <span data-bind="text: '(' + $root.translations.resourceInstanceName + ')'" style="padding: 0 5px"></span>
        <!--/ko-->
    </div>
    <div><span data-bind="text: tabs()[activeTabIndex()].name"></span> <span style="background: purple; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; margin-left: 8px;">CUSTOM</span></div>
</div>
<!-- ko if: tabs()[activeTabIndex()].header_component  -->
<div class="tabbed-report-header" data-bind="component: {
    name: tabs()[activeTabIndex()].header_component,
    params: $data
}"></div>
<!-- /ko -->
<!-- /ko -->
<style>
/* Square tab styling */
.report-tab-square {
    border-radius: 4px !important;  /* Small radius for square corners */
    min-width: 80px !important;
    height: auto !important;
    padding: 10px 20px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    text-align: center !important;
    margin: 0 4px !important;
}

.report-tab-square.active { 
    background-color: #6c5ce7 !important;  /* Purple */
    color: white !important;
}

.report-tab-square:not(.active) {
    background-color: #f0f0f0 !important;
    color: #333 !important;
}

.report-tab-square:hover:not(.active) {
    background-color: #e0e0e0 !important;
}

/* Adjust tab list spacing */
.tabbed-report-tab-list {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    margin-bottom: 15px !important;
}
</style>
{% endblock header %}


{% block header_form %}
<div style="display: flex; flex-direction: row">
<div id="card-save-tile-btn" class="install-buttons">
    <button class="btn btn-shim btn-mint btn-labeled btn-md fa fa-plus" data-bind="click: addTab"><span data-bind="text: $root.translations.addTab" ></span></button>
</div>
</div>
<div data-bind="sortable: {
    data: tabs,
    as: 'tab',
    afterMove: moveTab
}">
<div class="report-tab-form" data-bind="click: function(){$parent.setActiveTab($index())}, css: {'active': ko.unwrap($parent.activeTabIndex) === $index()}">
    <div style="display: flex; flex-direction: column">
        <div class="report-tab-form-title">
        <div data-bind="text: tab.name"></div>
        <span data-bind="click: function(){$parent.removeTab(tab)}"><i class="fa fa-close"></i></span>
        </div>
        <div>
            <div class="col-xs-12 pad-nor" style="padding: 5px">
                <input type="" data-bind="attr: {placeholder: $root.translations.tabName}, textInput: tab.name" class="form-control input-md widget-input" />
            </div>
            <div class="col-xs-12 pad-nor" style="padding: 5px">
                <!--ko if: $parent.icons().length > 0 -->
                <select
                    class="design"
                    data-bind="
                        placeholder: $root.translations.selectTabIcon,
                        value: tab.icon,
                        options: $parent.icons(),
                        optionsText: 'name',
                        optionsValue: 'cssclass',
                        chosen: {disable_search_threshold: 10, width: '100%'}
                    "
                ></select>
                <!--/ko-->
            </div>
            <div class="col-xs-12 pad-nor" style="padding: 5px">
                <select
                    class="design"
                    multiple
                    data-bind="
                        placeholder: $root.translations.selectCardsInTab,
                        selectedOptions: tab.nodegroup_ids,
                        options: $parent.topcards,
                        optionsText: 'name',
                        optionsValue: 'nodegroupid',
                        chosen: {disable_search_threshold: 10, width: '100%'}
                    "
                ></select>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock header_form %}


{% block body %}

    <!--ko if: hasProvisionalData() && (editorContext === false) -->
    <div class="report-provisional-flag"><span data-bind="text: $root.translations.pendingProvisionalEditsNotDisplayed"></span></div>
    <!--/ko-->
    <!--ko if: hasProvisionalData() && (editorContext === true && report.userisreviewer === true) -->
    <div class="report-provisional-flag"><span data-bind="text: $root.translations.pendingProvisionalEditsNotDisplayed"></span></div>
    <!--/ko-->
    <!--ko if: hasProvisionalData() && (editorContext === true && report.userisreviewer === false) -->
    <div class="report-provisional-flag"><span data-bind="text: $root.translations.pendingProvisionalEdits"></div>
    <!--/ko-->


    <!-- ko if: tabs && tabs() && tabs().length > 0 && tabs()[activeTabIndex()] && activeTabEmpty() && tabs()[activeTabIndex()].empty_component && tabs()[activeTabIndex()].empty_component.length > 0  -->
    <div class="tabbed-report-emptypanel" data-bind="component: {
        name: tabs()[activeTabIndex()].empty_component,
        params: $data
    }"></div>
    <!--/ko-->
    <!-- ko if: tabs && tabs() && tabs().length > 0 && tabs()[activeTabIndex()] && (!tabs()[activeTabIndex()].empty_component || !activeTabEmpty())  -->
    <div class="rp-report-section relative rp-report-section-root rp-tabpanel-id" role="tabpanel" aria-live="polite">
        <!-- ko if: tabs()[activeTabIndex()].side_component && tabs()[activeTabIndex()].side_component.length > 0  -->
        <div class="tabbed-report-sidepanel-wrapper">
            <div class="tabbed-report-sidepanel" data-bind="component: {
                name: tabs()[activeTabIndex()].side_component,
                params: $data
            }"></div>
        </div>
        <!-- /ko -->
        <div class="rp-report-section-title", data-bind="css: {'tabbed-report-sidepanel-active': tabs()[activeTabIndex()] && tabs()[activeTabIndex()].side_component}">
            <!-- ko if: tabs()[activeTabIndex()] && tabs()[activeTabIndex()].main_component && tabs()[activeTabIndex()].main_component.length > 0  -->
            <div class="tabbed-report-sidepanel-wrapper">
                <div class="tabbed-report-mainpanel" data-bind="component: {
                    name: tabs()[activeTabIndex()].main_component,
                    params: $data
                }"></div>
            </div>
            <!-- /ko -->
            <!-- ko ifnot: tabs()[activeTabIndex()].main_component  -->
            <!-- ko foreach: { data: activeCards(), as: 'card' } -->
            <!-- ko if: $parent.hideEmptyNodes() === false || card.tiles().length > 0 -->
                <!-- ko if: $index() !== 0 --><hr class="rp-tile-separator"><!-- /ko -->
                <div class="rp-card-section">
                    <!--ko if: card && card.alternateReportComponent -->
                    <!--/ko -->
                    <!--ko ifnot: card.model && card.alternateReportComponent -->
                        <!-- ko component: {
                            name: card.model.cardComponentLookup[card.model.component_id()].componentname,
                            params: {
                                state: 'report',
                                card: card,
                                pageVm: {...$root, report: $parent.report},
                                hideEmptyNodes: $parent.hideEmptyNodes
                            }
                        } -->
                        <!-- /ko -->
                    <!-- /ko -->
                </div>
            <!-- /ko -->
            <!-- /ko -->
            <!-- /ko -->
        </div>
    </div>
    <!--/ko-->

{% endblock body %}
